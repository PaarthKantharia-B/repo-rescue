name: 15-Minute Passive Incremental Synchronization Cron

on:
  schedule:
    # Runs every 15 minutes (00:00, 00:15, 00:30, 00:45...)
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  trigger-incremental-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Repo Rescue Incremental Sync Endpoint
        run: |
          curl -s -f -X GET \
            -H "Authorization: Bearer ${{ secrets.SYNC_CRON_SECRET }}" \
            "https://repo-rescue.vercel.app/api/admin/sync?cron=true&mode=incremental"
